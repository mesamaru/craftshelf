# v03 の安定版を出す: v03.xx.xx のタグを push したら(VERSION と同じ番号のときだけ)、
# Docker のイメージ(ghcr.io/mesamaru/craftshelf:v03 と :03.xx.xx)と、ビルド済みの一式を付けた GitHub のリリース v03.xx.xx を作る。
# v02 のパネルの「v03 に移る」と、v03 の「パネルのバージョン」はこのリリースを使う。
# まだ v02 が main(:latest)なので、リリースは「最新」にしない(v02 のインストーラー版が見るのは最新の正式リリース)
name: release-v03
on:
  push:
    tags: ["v03.*"]
permissions:
  contents: write
  packages: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: タグと VERSION が同じか確かめる
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "タグ ${GITHUB_REF_NAME} と VERSION ($v) が違います"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
  image:
    needs: [test, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mesamaru/craftshelf:v03
            ghcr.io/mesamaru/craftshelf:${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/mesamaru/craftshelf
            org.opencontainers.image.description=CraftShelf v03
  bundle:
    needs: [test, check]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: |
          v="${{ needs.check.outputs.version }}"
          npm ci && npm run build
          f="craftshelf-v03-$v.tar.gz"
          tar -czf "$f" .output drizzle VERSION
          sha256sum "$f" > SHA256SUMS
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "v$v" "$f" SHA256SUMS --verify-tag --latest=false --title "v$v(v03)" --notes-file notes.md
