# v03 の安定版を出す: v03.xx.xx のタグを push したら(VERSION と同じ番号のときだけ)、
# Docker のイメージ(ghcr.io/mesamaru/craftshelf:v03 と :03.xx.xx)と、ビルド済みの一式・Docker なしで動かす配布物を付けた GitHub のリリース v03.xx.xx を作る。
# v02 のパネルの「v03 に移る」と、v03 の「パネルのバージョン」はこのリリースを使う。
# まだ v02 が main(:latest)なので、リリースは「最新」にしない(v02 のインストーラー版が見るのは最新の正式リリース)
name: release-v03
on:
  push:
    tags: ["v03.*"]
permissions:
  contents: write
  packages: write
jobs:
  test:
    uses: ./.github/workflows/test.yml
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: タグと VERSION が同じか確かめる
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "タグ ${GITHUB_REF_NAME} と VERSION ($v) が違います"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
  image:
    needs: [test, check]
    runs-on: ubuntu-latest
    # ビルドは Dockerfile の build の段階でビルドする機械の CPU のまま動かし、arm64 はエミュレーションで写すだけ。止まったときに長く待たない
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mesamaru/craftshelf:v03
            ghcr.io/mesamaru/craftshelf:${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/mesamaru/craftshelf
            org.opencontainers.image.description=CraftShelf v03
  # macOS のメニューバーのアイコン(packaging/tray-macos.swift)。arm64 と x86_64 をまとめて 1 つにし、署名なし(ad-hoc)で配布物に入れる
  tray-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: |
          swiftc -O -target arm64-apple-macos11 -o tray-arm64 packaging/tray-macos.swift
          swiftc -O -target x86_64-apple-macos11 -o tray-x64 packaging/tray-macos.swift
          lipo -create tray-arm64 tray-x64 -output craftshelf-tray
          codesign --force --sign - craftshelf-tray
          lipo -info craftshelf-tray
      - uses: actions/upload-artifact@v4
        with: { name: craftshelf-tray, path: craftshelf-tray }
  bundle:
    needs: [test, check, tray-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: craftshelf-tray, path: packaging }
      - run: |
          v="${{ needs.check.outputs.version }}"
          npm ci && npm run build
          f="craftshelf-v03-$v.tar.gz"
          tar -czf "$f" .output drizzle VERSION
          # Docker なしで動かす配布物(Node.js ごと。Windows・macOS・Linux の x64 と arm64。install.sh は Linux のものを使う)
          node scripts/package.mjs all
          mv dist/* .
          sha256sum "$f" craftshelf-v03-$v-*.zip craftshelf-v03-$v-*.tar.gz > SHA256SUMS
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          gh release create "v$v" "$f" craftshelf-v03-$v-*.zip craftshelf-v03-$v-*.tar.gz SHA256SUMS --verify-tag --latest=false --title "v$v(v03)" --notes-file notes.md
