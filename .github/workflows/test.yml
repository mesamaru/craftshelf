# push・プルリクエストのたびにテストを動かす。リリースのビルドもこれが通ってから行う(release.yml から呼ぶ)。
name: Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      offline:
        description: "外部のサービス(Modrinth・PaperMC など)を使うテストを飛ばす"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 古い版から移すテストがタグを使う
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt -r tests/requirements.txt
      - name: Run tests
        env:
          CRAFTSHELF_TEST_OFFLINE: ${{ inputs.offline && '1' || '' }}
        run: python -m pytest -q -p no:cacheprovider
