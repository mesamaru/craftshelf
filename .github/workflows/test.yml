name: test
on: [push, pull_request, workflow_call]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # 自分用の版: 1 つのコンテナで、設定なしで動くか(最初の 1 人は登録でき、2 人目は招待が要る)
  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t craftshelf-self .
      - name: 起動できない版が選ばれていても、イメージの版で起動する
        run: mkdir -p data/v03/versions && echo 03.99.99 > data/v03/versions/current
      - run: docker run -d --name cs -p 8765:8080 -v "$PWD/data:/data" craftshelf-self
      - name: 起動を待つ
        run: |
          for i in $(seq 60); do curl -fs http://127.0.0.1:8765/api/auth/ok && exit 0; sleep 2; done
          exit 1
      - name: 最初の 1 人は登録でき、2 人目は断られる
        run: |
          signup() {
            curl -s -o /tmp/out -w '%{http_code}' -H "origin: http://127.0.0.1:8765" -H "content-type: application/json" \
              -d "{\"name\":\"$1\",\"email\":\"$1@example.com\",\"password\":\"ci-password-0123\"}" http://127.0.0.1:8765/api/auth/sign-up/email
          }
          test "$(signup first)" = 200 && grep -q '"token"' /tmp/out
          test "$(signup second)" = 403
      - name: データは /data/v03 にできる・起動できない版の選択は消える
        run: |
          sudo test -s data/v03/secret && sudo test -d data/v03/pg
          ! sudo test -f data/v03/versions/current
          docker logs cs 2>&1 | grep -q "イメージの版"
      - if: failure()
        run: docker logs cs

  # サービス版の構成(docker-compose.service.yml)を実際に起動して、app・PostgreSQL・バックアップのコンテナが動くか確かめる
  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.service.yml
    steps:
      - uses: actions/checkout@v7
      - name: .env を作る
        run: |
          {
            echo "APP_URL=http://localhost:3000"
            echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "TUNNEL_TOKEN=unused-in-ci"
          } > .env
      - run: docker compose up -d --build --wait app postgres
      - name: 死活確認と登録
        run: |
          docker compose exec -T app wget -qO- http://127.0.0.1:3000/api/auth/ok
          docker compose exec -T app wget -qO- --header "origin: http://localhost:3000" --header "content-type: application/json" \
            --post-data '{"name":"ci","email":"ci@example.com","password":"ci-password-0123"}' \
            http://127.0.0.1:3000/api/auth/sign-up/email | grep -q '"token"'
      - name: バックアップのコンテナからデータベースが読める
        run: docker compose run --rm -T --entrypoint pg_dump backup --schema-only | grep -q 'CREATE TABLE public.organization'
      - name: NAS がつながっていないときは失敗する
        run: |
          if docker compose run --rm -T -e BACKUP_TARGETS=nas backup now; then echo "失敗するはずが成功した"; exit 1; fi
      - if: failure()
        run: docker compose logs
