services:
  mc-pack-library:
    build: .
    container_name: mc-pack-library
    restart: unless-stopped
    # Unraid の標準ユーザー(nobody:users)で動かす場合はコメントを外してください。
    # その場合、下の volumes 先のフォルダも  chown -R 99:100 <フォルダ>  で
    # 所有者を合わせておかないと Permission denied になります。
    # また /app は root 所有でビルドされるため、自動更新(GITHUB_REPO)も
    # 使うなら root 実行のままにしておくのが簡単です。
    # user: "99:100"
    #
    # Web設定パネルからSMB/NFS接続(Unraid以外の保存先、TrueNASなど)を登録して
    # 使う場合、コンテナ内で `mount` コマンドを実行できる必要があるため、
    # 以下の cap_add / security_opt を有効にしてください(下のコメントアウトを解除)。
    # これは root 実行が前提です。上の user: の指定とは併用しないでください。
    # cap_add:
    #   - SYS_ADMIN
    #   - DAC_READ_SEARCH
    # security_opt:
    #   - apparmor:unconfined
    #   - seccomp:unconfined
    # 上記でもホストのセキュリティ設定(AppArmor/SELinuxなど)により mount に
    # 失敗する場合の最終手段として、代わりに次の1行だけを使うこともできます
    # (コンテナにほぼ全権限を与えるため、他の方法で動かない場合のみ推奨)。
    # privileged: true
    ports:
      - "8765:8080"
    volumes:
      # 左側を Unraid 上の保存したい共有フォルダに変えてください
      # (ローカル保存先。Web設定パネルからSMB/NFSを追加登録することもできます)
      - /mnt/user/minecraft/library:/data
    environment:
      - TZ=Asia/Tokyo
      # 起動のたびにGitHubの最新コードを取得して反映する(README の「自動更新」参照)。
      # リポジトリを作って push したら、ここに "ユーザー名/リポジトリ名" を入れてください。
      - GITHUB_REPO=
      - GITHUB_BRANCH=main
      # - AUTO_UPDATE=false   # 自動更新を止めたい場合はコメントを外す
      # 家庭内LANの外に公開する場合はパスワードを付けてください(公開自体は非推奨)
      # - AUTH_USER=maru
      # - AUTH_PASS=change-me
      # index.db だけ別の場所(キャッシュ上のappdataなど)に置きたい場合
      # - DB_DIR=/config
    # volumes に  - /mnt/user/appdata/mc-pack-library:/config  も足してください
