services:
  craftshelf:
    build: .
    container_name: craftshelf
    restart: unless-stopped
    # Unraid の標準ユーザー(nobody:users)で動かす場合はコメントを外してください。
    # その場合、下の volumes 先のフォルダも  chown -R 99:100 <フォルダ>  で
    # 所有者を合わせておかないと Permission denied になります。
    # また /app は root 所有でビルドされるため、自動更新(GITHUB_REPO)も
    # 使うなら root 実行のままにしておくのが簡単です。
    # user: "99:100"
    #
    # Web設定パネルから SMB(Unraid・TrueNAS・Synology・Windows 共有)/ WebDAV(Nextcloud)の保存先を追加できます。
    # アプリ自身が直接通信するので、cap_add / security_opt / privileged などの
    # 特別な権限は不要です(Proxmox の非特権LXC の中の Docker でも動きます)。
    ports:
      - "8765:8080"
    volumes:
      # 左側を、ファイルを保存したいフォルダに変えてください(例: Unraid なら /mnt/user/minecraft/library)
      # (ローカル保存先。Web設定パネルからSMB/WebDAVを追加登録することもできます)
      - ./data:/data
    environment:
      # タイムゾーン(例: Asia/Tokyo, Europe/London, America/New_York)
      - TZ=Asia/Tokyo
      # 起動のたびに GitHub の最新コードを取得して反映する(README の「アップデート」参照)。
      # 画面の「🔄 パネルの更新」もこのリポジトリを見ます。
      - GITHUB_REPO=mesamaru/craftshelf
      - GITHUB_BRANCH=main
      # - AUTO_UPDATE=false   # 自動更新を止めたい場合はコメントを外す
      # 初回起動時に管理者アカウントを自動作成したい場合(省略時は画面の初期設定で作成)
      # - AUTH_USER=admin
      # - AUTH_PASS=change-me
      # index.db だけ別の場所(キャッシュ上のappdataなど)に置きたい場合
      # - DB_DIR=/config
    # volumes に  - ./config:/config  も足してください
