# 自分のサーバー機で動かす(自分用の版)。v02 と同じく 1 つのコンテナで、データは ./data に置く。
# v02 から切り替えるときは、v02 の docker-compose.yml の build: . を下の image: に変えるだけでよい
# (同じ /data を使う。v03 のデータは /data/v03 に作るので、v02 のデータはそのまま残る)
services:
  craftshelf:
    image: ghcr.io/mesamaru/craftshelf:dev
    container_name: craftshelf
    restart: unless-stopped
    ports:
      - "8765:8080"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Tokyo
      # パスキーを使うときや、リバースプロキシの後ろに置くときは、開く URL を書く(例 https://craftshelf.example.com)
      # - APP_URL=
