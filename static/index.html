<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CraftShelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232b7a58%27/%3E%3Cpath d=%27M8 12l8-4 8 4v9l-8 4-8-4z M8 12l8 4 8-4 M16 16v9%27 fill=%27none%27 stroke=%27white%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f6f3; --surface: #ffffff; --surface-2: #f0f3ef; --ink: #1b2420; --muted: #65716b;
  --line: #dde2dd; --accent: #2b7a58; --accent-ink: #ffffff; --accent-soft: #e4f1ea;
  --danger: #b3382c; --shadow: 0 8px 32px rgba(20, 30, 25, .18);
  --c-plugin: #2f6fdb; --c-mod: #1f8f5f; --c-datapack: #b97a10; --c-resourcepack: #8a4fd6; --c-other: #6b7772;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1b2220; --surface-2: #232c29; --ink: #e5ebe8; --muted: #8e9b95;
    --line: #2d3835; --accent: #52b88d; --accent-ink: #0b1511; --accent-soft: #1f3129;
    --danger: #ef7d70; --shadow: 0 8px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b2220; --surface-2: #232c29; --ink: #e5ebe8; --muted: #8e9b95;
  --line: #2d3835; --accent: #52b88d; --accent-ink: #0b1511; --accent-soft: #1f3129;
  --danger: #ef7d70; --shadow: 0 8px 32px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.55 "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.top h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.stats { color: var(--muted); font-size: 13px; text-align: right; }
.stats b { color: var(--ink); font-weight: 600; }

/* drop zone */
.drop {
  border: 2px dashed var(--line); background: var(--surface); border-radius: 14px;
  padding: 22px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  transition: border-color .15s, background .15s;
}
.drop:hover { border-color: var(--accent); background: var(--accent-soft); }
.drop.disabled { opacity: .55; pointer-events: none; }
.drop-main strong { display: block; font-size: 16px; }
.drop-main span { color: var(--muted); font-size: 13px; }
.drop-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.drop-actions label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.btn {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; line-height: 1.4;
  transition: border-color .12s, background .12s;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, select:focus-visible, input:focus-visible, .row:focus-visible, .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
select, input[type=text], input[type=search], input[type=password] {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}

/* queue */
.queue { margin-top: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.queue-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 14px; background: var(--surface-2); font-size: 13px; }
.queue-list { max-height: 220px; overflow: auto; }
.q { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.8fr); gap: 12px; padding: 6px 14px; font-size: 13px; border-top: 1px solid var(--line); align-items: center; }
.q .fn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q .st { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q.added .st { color: var(--accent); }
.q.error .st { color: var(--danger); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; }

/* storage bar / banner */
.storagebar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: -6px 0 14px; flex-wrap: wrap; }
.storagebar-info { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); flex: none; }
.dot.ok { background: var(--accent); }
.dot.err { background: var(--danger); }
.banner {
  background: color-mix(in srgb, var(--danger) 10%, var(--surface)); border: 1px solid var(--danger);
  color: var(--ink); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 14px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
}
.banner[hidden] { display: none; }

/* storage target cards (settings panel) */
.target { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.target.active { border-color: var(--accent); background: var(--accent-soft); }
.target .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.target .head strong { font-size: 15px; }
.target .detail { font-size: 12px; color: var(--muted); margin-top: 3px; word-break: break-all; }
.target .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.target .test-result { font-size: 12px; margin-top: 6px; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); white-space: pre-wrap; }
.target .test-result.ok { color: var(--accent); }
.target .test-result.err { color: var(--danger); }
.field-hint { font-size: 12px; color: var(--muted); margin-top: -2px; }
.proto-only { display: none; }
.proto-only.on { display: flex; flex-direction: column; gap: 4px; }

/* toolbar */
.toolbar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin: 22px 0 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.search { min-width: 220px; flex: 0 1 300px; }
.search input { width: 100%; }

/* list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.cols, .row {
  display: grid; grid-template-columns: 116px minmax(0, 1fr) 150px 90px 90px 96px; gap: 12px; align-items: center; padding: 0 14px;
}
.cols { background: var(--surface-2); font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
.cols button { background: none; border: 0; padding: 8px 0; text-align: left; color: inherit; font-size: 12px; }
.cols button:hover { color: var(--ink); }
.cols button[data-dir]::after { content: attr(data-dir); margin-left: 4px; color: var(--accent); }
.row { width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding-top: 11px; padding-bottom: 11px; }
.cols + .row { border-top: 0; }
.row:hover { background: var(--accent-soft); }
.row.sel { background: var(--accent-soft); }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .latest { font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.badge {
  --c: var(--c-other); display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 15%, transparent); color: color-mix(in srgb, var(--c) 72%, var(--ink));
}
.badge.plugin { --c: var(--c-plugin); } .badge.mod { --c: var(--c-mod); } .badge.datapack { --c: var(--c-datapack); }
.badge.resourcepack { --c: var(--c-resourcepack); } .badge.other { --c: var(--c-other); }
.empty { padding: 44px 16px; text-align: center; color: var(--muted); }

/* side panel */
.backdrop { position: fixed; inset: 0; background: rgba(10, 16, 13, .35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
.backdrop.on { opacity: 1; pointer-events: auto; }
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: var(--surface); box-shadow: var(--shadow);
  transform: translateX(105%); transition: transform .22s ease; z-index: 30; display: flex; flex-direction: column;
}
.panel.on { transform: none; }
.panel-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
.panel-head .line1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.panel-head h2 { margin: 6px 0 2px; font-size: 20px; word-break: break-word; }
.panel-head .desc { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.panel-tools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.panel-tools .sp { flex: 1; }
.panel-body { overflow: auto; padding: 14px 18px 40px; display: flex; flex-direction: column; gap: 10px; }
.ver { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.ver.latest { border-color: var(--accent); background: var(--accent-soft); }
.ver.missing { border-style: dashed; }
.ver .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ver .vnum { font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; word-break: break-all; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.tag.warn { background: var(--danger); color: #fff; }
.tag.soft { background: var(--surface-2); color: var(--muted); font-weight: 500; border: 1px solid var(--line); }
.ver .file { font-size: 13px; color: var(--muted); word-break: break-all; margin-top: 3px; }
.ver .meta { font-size: 12px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
.ver .note { font-size: 13px; margin-top: 6px; padding: 5px 8px; background: var(--surface-2); border-radius: 6px; white-space: pre-wrap; }
.ver .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
a.btn { text-decoration: none; display: inline-block; color: inherit; }

/* dialog */
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 16, 13, .45); }
dialog form { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
dialog h3 { margin: 0; font-size: 17px; }
dialog p { margin: 0; color: var(--muted); font-size: 14px; word-break: break-word; }
dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
dialog label input, dialog label select { color: var(--ink); }
dialog .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

/* overlay while dragging */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--accent) 22%, transparent); backdrop-filter: blur(2px);
  font-size: 24px; font-weight: 700; pointer-events: none;
}
.overlay.on { display: flex; }
.overlay div { background: var(--surface); border: 3px dashed var(--accent); border-radius: 20px; padding: 40px 56px; box-shadow: var(--shadow); }

/* toast */
.toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(520px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow); }
.toast.err { background: var(--danger); color: #fff; }

/* auth screen */
.auth { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.auth[hidden] { display: none; }
.auth form { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: min(380px, 100%); display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); }
.auth h2 { margin: 0; font-size: 20px; }
.auth p { margin: 0; color: var(--muted); font-size: 13px; }
.auth label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.auth .err { color: var(--danger); font-size: 13px; min-height: 1em; }
.userbox { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; margin-top: 6px; }
/* role based visibility */
body:not(.can-edit) .need-editor { display: none !important; }
body:not(.can-admin) .need-admin { display: none !important; }
/* jobs */
.jobs { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.job { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.job .jl { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.job .log { color: var(--muted); font-size: 12px; white-space: pre-wrap; max-height: 120px; overflow: auto; margin-top: 4px; }
.job.error { border-color: var(--danger); }
/* source (update) box */
.srcbox { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface-2); font-size: 13px; }
.srcbox .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.srcbox .muted { color: var(--muted); font-size: 12px; }
.srcbox .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tag.upd { background: #c07a12; color: #fff; }
.cand { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.cand:first-child { border-top: 0; }
.cand .t { overflow: hidden; text-overflow: ellipsis; }
.cand small { color: var(--muted); display: block; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 500; font-size: 12px; }
.scroll { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
dialog.wide { width: min(720px, calc(100vw - 32px)); }
.filelist { font-size: 12px; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 140px; overflow: auto; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; }

@media (max-width: 760px) {
  .cols, .row { grid-template-columns: 96px minmax(0, 1fr) 110px; }
  .cols .hide-s, .row .hide-s { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>CraftShelf</h1>
      <p>プラグイン・Mod・データパック・リソースパックの保管庫</p>
    </div>
    <div>
      <div class="stats" id="stats"></div>
      <div class="userbox" id="userbox"></div>
    </div>
  </header>

  <div class="storagebar">
    <div class="storagebar-info" id="storageInfo"></div>
    <div class="drop-actions">
      <button class="btn small need-admin" id="selfUpdBtn" type="button">🔄 パネルの更新</button>
      <button class="btn small need-admin" id="settingsBtn" type="button">⚙ 設定</button>
      <button class="btn small need-admin" id="storageBtn" type="button">🗄 ストレージ設定</button>
    </div>
  </div>
  <div class="banner" id="storageBanner" hidden></div>
  <div class="jobs" id="jobs"></div>

  <section class="drop need-editor" id="drop">
    <div class="drop-main">
      <strong>ここにファイルやフォルダをドラッグ&amp;ドロップ</strong>
      <span>.jar / .zip をまとめて投げ込めます。名前とバージョンは中身から自動で読み取ります。</span>
    </div>
    <div class="drop-actions">
      <label>登録先
        <select id="catOverride" aria-label="登録先の種類">
          <option value="">自動判定</option>
        </select>
      </label>
      <button class="btn primary" id="pickFiles" type="button">ファイルを選択</button>
      <button class="btn" id="pickDir" type="button">フォルダを選択</button>
      <button class="btn" id="scanBtn" type="button" title="NAS上の inbox フォルダに直接コピーしたファイルや、手で置いたファイルを取り込みます">inboxを取り込む</button>
    </div>
    <input type="file" id="fileInput" multiple hidden>
    <input type="file" id="dirInput" webkitdirectory hidden>
  </section>

  <section class="queue" id="queue" hidden>
    <div class="queue-head"><span id="queueSummary"></span><button class="btn small" id="queueClear" type="button">完了分を消す</button></div>
    <div class="queue-list" id="queueList"></div>
  </section>

  <section class="toolbar">
    <div class="chips" id="chips" role="group" aria-label="種類で絞り込み"></div>
    <div class="drop-actions need-editor">
      <button class="btn small" id="importBtn" type="button" title="Modrinth / SpigotMC / CurseForge の配布ページのURLから最新版を取得して登録します">🔗 URLから追加</button>
      <button class="btn small" id="updCheckBtn" type="button" title="配布元を紐付けたアイテムの最新版を確認します">↻ 更新を確認</button>
      <select id="updMore" aria-label="更新のその他の操作" class="btn small" style="padding:3px 6px">
        <option value="">その他…</option>
        <option value="detect">未連携の配布元を自動検出して確認</option>
        <option value="download">確認して更新をすべて保存</option>
      </select>
    </div>
    <div class="search"><input type="search" id="search" placeholder="名前・ファイル名で検索" aria-label="検索"></div>
  </section>

  <section class="list" id="list"></section>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="panel" id="panel" aria-label="バージョン一覧" aria-hidden="true"></aside>
<aside class="panel" id="storagePanel" aria-label="ストレージ設定" aria-hidden="true"></aside>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="overlay" id="overlay"><div>ここにドロップして登録</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="auth" id="auth" hidden><form id="authForm" autocomplete="on"></form></div>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const CATS = { plugin: "プラグイン", mod: "Mod", datapack: "データパック", resourcepack: "リソースパック", other: "その他" };
const state = { items: [], cat: "all", q: "", sortKey: "name", sortDir: 1, selected: null, verOrder: "desc", storage: {}, version: null, storageOpen: false, targets: [], user: null, jobs: [], candidates: {} };
const PROVIDERS = { modrinth: "Modrinth", spigot: "SpigotMC", curseforge: "CurseForge" };
const SRC_STATUS = { up_to_date: "最新", update: "更新あり", error: "確認できません", unchecked: "未確認" };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtSize = (n) => {
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB", "TB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n >= 100 ? 0 : 1) + " " + u[i];
};
const fmtDate = (iso) => new Date(iso).toLocaleDateString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit" });
const fmtDateTime = (iso) => new Date(iso).toLocaleString("ja-JP", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
const verLabel = (v) => v || "(バージョン不明)";

async function api(path, opts = {}) {
  opts.headers = { "X-Requested-With": "mcpl", ...(opts.headers || {}) };
  if (opts.json !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.json); delete opts.json;
    opts.method = opts.method || "POST";
  }
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch { /* not json */ }
  if (res.status === 401 && !path.startsWith("/api/auth/")) { showAuth(false); }
  if (!res.ok) throw new Error((data && data.error) || `HTTP ${res.status}`);
  return data;
}
function toast(msg, isErr = false) {
  const el = document.createElement("div");
  el.className = "toast" + (isErr ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), isErr ? 7000 : 4000);
}

/* ---------------- data ---------------- */
let refreshTimer = null;
function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 250); }
async function refresh() {
  try {
    const d = await api("/api/library");
    state.items = d.items; state.storage = d.storage; state.version = d.version; state.build = d.build;
    if (state.selected && !state.items.some((i) => i.id === state.selected)) closePanel();
    render();
  } catch (e) { toast("読み込みに失敗しました: " + e.message, true); }
}

/* ---------------- list ---------------- */
function filtered() {
  const q = state.q.trim().toLowerCase();
  let list = state.items.filter((it) => state.cat === "all" || it.category === state.cat
    || (state.cat === "__upd" && it.source && it.source.status === "update"));
  if (q) list = list.filter((it) =>
    it.name.toLowerCase().includes(q) ||
    it.versions.some((v) => v.filename.toLowerCase().includes(q) || v.version.toLowerCase().includes(q)));
  const k = state.sortKey, dir = state.sortDir;
  const cmpName = (a, b) => a.name.localeCompare(b.name, "ja", { numeric: true, sensitivity: "base" });
  list.sort((a, b) => {
    let r = 0;
    if (k === "name") r = cmpName(a, b);
    else if (k === "count") r = a.versions.length - b.versions.length;
    else if (k === "size") r = a.total_size - b.total_size;
    else if (k === "added") r = a.last_added < b.last_added ? -1 : a.last_added > b.last_added ? 1 : 0;
    return (r || cmpName(a, b)) * dir;
  });
  return list;
}

function render() {
  // stats
  const total = state.items.reduce((s, i) => s + i.total_size, 0);
  const nv = state.items.reduce((s, i) => s + i.versions.length, 0);
  $("#stats").innerHTML = `<b>${state.items.length}</b> 件 / <b>${nv}</b> ファイル / <b>${fmtSize(total)}</b>${state.version ? `<br><span title="${esc(state.build || "")}">CraftShelf v${esc(state.version)}</span>` : ""}`;
  renderStorageBar();

  // chips
  const counts = { all: state.items.length };
  for (const k of Object.keys(CATS)) counts[k] = state.items.filter((i) => i.category === k).length;
  $("#chips").innerHTML = ["all", ...Object.keys(CATS)]
    .filter((k) => k === "all" || counts[k] > 0 || state.cat === k)
    .map((k) => `<button class="chip" type="button" data-cat="${k}" aria-pressed="${state.cat === k}">${k === "all" ? "すべて" : CATS[k]}<span class="n">${counts[k]}</span></button>`).join("")
    + (() => {
      const n = state.items.filter((i) => i.source && i.source.status === "update").length;
      return n || state.cat === "__upd" ? `<button class="chip" type="button" data-cat="__upd" aria-pressed="${state.cat === "__upd"}">⬆ 更新あり<span class="n">${n}</span></button>` : "";
    })();

  // list
  const list = filtered();
  const arrow = (k) => (state.sortKey === k ? (state.sortDir === 1 ? "▲" : "▼") : "");
  const head = `<div class="cols">
      <span>種類</span>
      <button type="button" data-sort="name" ${arrow("name") ? `data-dir="${arrow("name")}"` : ""}>名前</button>
      <span>最新バージョン</span>
      <button type="button" class="hide-s" data-sort="count" ${arrow("count") ? `data-dir="${arrow("count")}"` : ""}>保存数</button>
      <button type="button" class="hide-s" data-sort="size" ${arrow("size") ? `data-dir="${arrow("size")}"` : ""}>サイズ</button>
      <button type="button" class="hide-s" data-sort="added" ${arrow("added") ? `data-dir="${arrow("added")}"` : ""}>最終追加</button>
    </div>`;
  if (!list.length) {
    $("#list").innerHTML = head + `<div class="empty">${state.items.length ? "条件に合うものがありません。" : "まだ何も登録されていません。上のエリアにファイルをドロップしてください。"}</div>`;
  } else {
    $("#list").innerHTML = head + list.map((it) => {
      const latest = it.versions.find((v) => v.id === it.latest_id);
      return `<button class="row${state.selected === it.id ? " sel" : ""}" type="button" data-id="${it.id}">
        <span><span class="badge ${it.category}">${CATS[it.category]}</span></span>
        <span class="name" title="${esc(it.name)}">${esc(it.name)}</span>
        <span class="latest">${esc(verLabel(latest.version))}${it.source && it.source.status === "update" ? ` <span class="tag upd" title="${esc(it.source.latest.version || "")}">更新あり</span>` : ""}</span>
        <span class="sub hide-s">${it.versions.length} 版</span>
        <span class="sub hide-s">${fmtSize(it.total_size)}</span>
        <span class="sub hide-s">${fmtDate(it.last_added)}</span>
      </button>`;
    }).join("");
  }
  if (state.selected) renderPanel();
  if (state.storageOpen) renderStoragePanel();
}

/* ---------------- storage bar / banner ---------------- */
function renderStorageBar() {
  const s = state.storage || {};
  const t = s.target;
  const ok = !s.error;
  const protoLabel = t ? (t.protocol_label || t.protocol) : "";
  const name = t ? t.name : "";
  const pathText = s.path ? esc(s.path) : "";
  $("#storageInfo").innerHTML = t
    ? `<span class="dot ${ok ? "ok" : "err"}"></span>${esc(name)}<span class="tag soft">${esc(protoLabel)}</span>${pathText ? `<span class="hide-s">${pathText}</span>` : ""}`
    : "";

  const banner = $("#storageBanner");
  if (s.error) {
    banner.hidden = false;
    banner.innerHTML = `<span>⚠ ${esc(s.error)}</span><button class="btn small" type="button" data-act="open-storage">設定を開く</button>`;
  } else {
    banner.hidden = true;
    banner.innerHTML = "";
  }
  const disabled = !!s.error;
  $("#drop").classList.toggle("disabled", disabled);
  $("#pickFiles").disabled = disabled;
  $("#pickDir").disabled = disabled;
  $("#scanBtn").disabled = disabled;
}
$("#storageBanner").addEventListener("click", (e) => {
  if (e.target.closest("[data-act='open-storage']")) openStoragePanel();
});
$("#storageBtn").addEventListener("click", openStoragePanel);

$("#chips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  state.cat = b.dataset.cat; render();
});
$("#search").addEventListener("input", (e) => { state.q = e.target.value; render(); });
$("#list").addEventListener("click", (e) => {
  const s = e.target.closest("[data-sort]");
  if (s) {
    const k = s.dataset.sort;
    if (state.sortKey === k) state.sortDir *= -1;
    else { state.sortKey = k; state.sortDir = k === "name" ? 1 : -1; }
    render(); return;
  }
  const r = e.target.closest(".row");
  if (r) openPanel(Number(r.dataset.id));
});

/* ---------------- side panel ---------------- */
function openPanel(id) {
  closeStoragePanel();
  state.selected = id;
  $("#panel").classList.add("on"); $("#panel").setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
  render();
  $("#panel .close")?.focus();
}
function closePanel() {
  state.selected = null;
  $("#panel").classList.remove("on"); $("#panel").setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
  document.querySelectorAll(".row.sel").forEach((r) => r.classList.remove("sel"));
}
function renderPanel() {
  const it = state.items.find((i) => i.id === state.selected);
  if (!it) return;
  const vs = state.verOrder === "desc" ? it.versions : [...it.versions].reverse();
  const latest = it.versions.find((v) => v.id === it.latest_id);
  const chips = (v) => [v.meta.loader, v.meta.mc && "MC " + v.meta.mc, v.meta.pack_format && "pack_format " + v.meta.pack_format]
    .filter(Boolean).map((t) => `<span class="tag soft">${esc(t)}</span>`).join("");
  $("#panel").innerHTML = `
    <div class="panel-head">
      <div class="line1"><span class="badge ${it.category}">${CATS[it.category]}</span>
        <button class="btn small close" type="button" data-act="close" aria-label="閉じる">閉じる</button></div>
      <h2>${esc(it.name)}</h2>
      <div class="desc">${it.versions.length} バージョン保存 / 合計 ${fmtSize(it.total_size)}</div>
      ${latest.meta.description ? `<p class="desc">${esc(latest.meta.description)}</p>` : ""}
      <div class="panel-tools">
        <button class="btn small need-editor" type="button" data-act="edit-item">名前・種類を編集</button>
        <button class="btn small" type="button" data-act="order">${state.verOrder === "desc" ? "新しい順" : "古い順"}</button>
        <span class="sp"></span>
        <button class="btn small danger need-editor" type="button" data-act="del-item">すべて削除</button>
      </div>
    </div>
    <div class="panel-body">
      ${sourceBoxHTML(it)}
      ${vs.map((v) => `
        <div class="ver${v.id === it.latest_id ? " latest" : ""}${v.missing ? " missing" : ""}" data-vid="${v.id}">
          <div class="head"><span class="vnum">${esc(verLabel(v.version))}</span>
            ${v.id === it.latest_id ? '<span class="tag">最新</span>' : ""}
            ${v.missing ? '<span class="tag warn">ファイルが見つかりません</span>' : ""}
            ${chips(v)}</div>
          <div class="file">${esc(v.filename)}</div>
          <div class="meta">${fmtSize(v.size)} ・ ${fmtDateTime(v.added_at)} に追加</div>
          ${v.note ? `<div class="note">${esc(v.note)}</div>` : ""}
          <div class="acts">
            ${v.missing ? "" : `<a class="btn small" href="/api/versions/${v.id}/download">ダウンロード</a>`}
            <button class="btn small need-editor" type="button" data-act="edit-ver">編集</button>
            <button class="btn small danger need-editor" type="button" data-act="del-ver">削除</button>
          </div>
        </div>`).join("")}
    </div>`;
}
$("#backdrop").addEventListener("click", () => { closePanel(); closeStoragePanel(); });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || $("#dlg").open) return;
  if (state.selected) closePanel();
  if (state.storageOpen) closeStoragePanel();
});
$("#panel").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const it = state.items.find((i) => i.id === state.selected); if (!it) return;
  const vid = Number(b.closest("[data-vid]")?.dataset.vid);
  const v = it.versions.find((x) => x.id === vid);
  if (b.dataset.act.startsWith("src-")) { await sourceAction(it, b.dataset.act, b); return; }
  switch (b.dataset.act) {
    case "close": closePanel(); break;
    case "order": state.verOrder = state.verOrder === "desc" ? "asc" : "desc"; renderPanel(); break;
    case "edit-item": editItem(it); break;
    case "edit-ver": editVersion(it, v); break;
    case "del-ver":
      if (await confirmDlg(`「${it.name}」の ${verLabel(v.version)} を削除しますか?`, `${v.filename}\n保存先のファイルも削除され、元に戻せません。`, "削除する")) {
        await run(() => api(`/api/versions/${v.id}`, { method: "DELETE" }), "削除しました");
      } break;
    case "del-item":
      if (await confirmDlg(`「${it.name}」をすべて削除しますか?`, `保存されている ${it.versions.length} バージョンのファイルがすべて削除され、元に戻せません。`, "すべて削除")) {
        await run(() => api(`/api/items/${it.id}`, { method: "DELETE" }), "削除しました");
      } break;
  }
});
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); await refresh(); }
  catch (e) { toast(e.message, true); }
}

/* ---------------- dialogs ---------------- */
function openDialog(html) {
  return new Promise((resolve) => {
    const dlg = $("#dlg"), form = $("#dlgForm");
    form.innerHTML = html;
    const done = (val) => { dlg.close(); dlg.onclose = null; resolve(val); };
    form.onsubmit = (e) => {
      e.preventDefault();
      const submitter = e.submitter;
      if (submitter && submitter.value === "cancel") return done(null);
      done(Object.fromEntries(new FormData(form).entries()));
    };
    dlg.onclose = () => resolve(null);
    dlg.showModal();
    form.querySelector("input, select, button[value=ok]")?.focus();
  });
}
async function confirmDlg(title, text, okLabel) {
  const r = await openDialog(`<h3>${esc(title)}</h3><p style="white-space:pre-wrap">${esc(text)}</p>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn danger" value="ok">${esc(okLabel)}</button></div>`);
  return r !== null;
}
async function editItem(it) {
  const r = await openDialog(`<h3>名前・種類を編集</h3>
    <p>同じ名前・種類の項目が既にある場合は、そちらに統合されます。</p>
    <label>名前<input type="text" name="name" value="${esc(it.name)}" required></label>
    <label>種類<select name="category">${Object.entries(CATS).map(([k, n]) => `<option value="${k}"${k === it.category ? " selected" : ""}>${n}</option>`).join("")}</select></label>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn primary" value="ok">保存</button></div>`);
  if (!r) return;
  await run(async () => {
    await api(`/api/items/${it.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(r) });
    // 統合された場合は選択中の項目が消えるので、名前・種類で追い直す
    await refresh();
    const t = state.items.find((i) => i.category === r.category && i.name.toLowerCase().replace(/[\W_]+/g, "") === r.name.toLowerCase().replace(/[\W_]+/g, ""));
    if (t) openPanel(t.id);
  }, "保存しました");
}
async function editVersion(it, v) {
  const r = await openDialog(`<h3>バージョン情報を編集</h3><p>${esc(v.filename)}</p>
    <label>バージョン<input type="text" name="version" value="${esc(v.version)}"></label>
    <label>メモ(使用中のサーバー、注意点など)<input type="text" name="note" value="${esc(v.note)}"></label>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn primary" value="ok">保存</button></div>`);
  if (!r) return;
  await run(() => api(`/api/versions/${v.id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(r) }), "保存しました");
}

/* ---------------- storage settings panel ---------------- */
async function fetchTargets() {
  try { state.targets = (await api("/api/storage/targets")).targets; }
  catch (e) { toast(e.message, true); }
}
function openStoragePanel() {
  closePanel();
  state.storageOpen = true;
  $("#storagePanel").classList.add("on"); $("#storagePanel").setAttribute("aria-hidden", "false");
  $("#backdrop").classList.add("on");
  renderStoragePanel();
  fetchTargets().then(renderStoragePanel);
}
function closeStoragePanel() {
  if (!state.storageOpen) return;
  state.storageOpen = false;
  $("#storagePanel").classList.remove("on"); $("#storagePanel").setAttribute("aria-hidden", "true");
  $("#backdrop").classList.remove("on");
}
function renderStoragePanel() {
  const targets = state.targets;
  $("#storagePanel").innerHTML = `
    <div class="panel-head">
      <div class="line1"><strong style="font-size:18px">ストレージ設定</strong>
        <button class="btn small close" type="button" data-sact="close" aria-label="閉じる">閉じる</button></div>
      <div class="desc">保存先を登録・切り替えできます。切り替えると表示される一覧もその保存先のものに変わります(ファイルの自動移動はしません)。</div>
      <div class="panel-tools"><span class="sp"></span><button class="btn small primary" type="button" data-sact="add">＋ 接続を追加</button></div>
    </div>
    <div class="panel-body">
      ${targets.length ? targets.map((t) => `
        <div class="target${t.active ? " active" : ""}" data-tid="${t.id}">
          <div class="head">
            <span class="dot ${t.protocol === "local" || t.mounted ? "ok" : "err"}"></span>
            <strong>${esc(t.name)}</strong>
            <span class="tag soft">${esc(t.protocol_label)}</span>
            ${t.active ? '<span class="tag">使用中</span>' : ""}
          </div>
          ${t.protocol !== "local" ? `<div class="detail">${targetDetail(t)}</div>` : ""}
          ${!t.supported ? `<div class="detail" style="color:var(--danger)">この方式には対応しなくなりました。「編集」で SMB に変更してください。</div>` : ""}
          ${t.last_error ? `<div class="detail" style="color:var(--danger)">前回のエラー: ${esc(t.last_error)}</div>` : ""}
          <div class="detail">登録アイテム数: ${t.item_count ?? "-"}</div>
          <div class="acts">
            ${t.active ? "" : `<button class="btn small primary" type="button" data-sact="activate">使用する</button>`}
            ${t.active && t.protocol !== "local" && !t.mounted ? `<button class="btn small primary" type="button" data-sact="activate">再接続</button>` : ""}
            <button class="btn small" type="button" data-sact="contents">中身を確認</button>
            <button class="btn small" type="button" data-sact="migrate">移行…</button>
            ${t.protocol !== "local" ? `<button class="btn small" type="button" data-sact="test">接続テスト</button>` : ""}
            ${t.protocol !== "local" ? `<button class="btn small" type="button" data-sact="edit">編集</button>` : ""}
            ${t.protocol !== "local" && !t.active ? `<button class="btn small danger" type="button" data-sact="delete">削除</button>` : ""}
          </div>
          <div class="test-result" hidden></div>
        </div>`).join("") : `<div class="empty">読み込み中…</div>`}
    </div>`;
}
$("#storagePanel").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-sact]"); if (!b) return;
  if (b.dataset.sact === "close") { closeStoragePanel(); return; }
  if (b.dataset.sact === "add") { await saveTarget(null); return; }
  const card = b.closest("[data-tid]");
  const tid = card ? Number(card.dataset.tid) : null;
  const t = state.targets.find((x) => x.id === tid);
  if (!t) return;
  if (b.dataset.sact === "contents") { showContents(t); return; }
  if (b.dataset.sact === "migrate") { openMigrate(t); return; }
  if (b.dataset.sact === "activate") {
    await run(async () => { await api(`/api/storage/targets/${tid}/activate`, { method: "POST" }); await fetchTargets(); },
      `「${t.name}」に切り替えました`);
    renderStoragePanel();
  } else if (b.dataset.sact === "edit") {
    await saveTarget(t);
  } else if (b.dataset.sact === "test") {
    const resultEl = card.querySelector(".test-result");
    resultEl.hidden = false; resultEl.className = "test-result"; resultEl.textContent = "接続中…";
    try {
      const r = await api(`/api/storage/targets/${tid}/test`, { method: "POST" });
      resultEl.className = "test-result " + (r.ok ? "ok" : "err");
      resultEl.textContent = r.message + (r.entries ? (r.entries.length ? `\n中身(先頭${r.entries.length}件): ${r.entries.join(", ")}` : "\n(空のフォルダです)") : "");
    } catch (e2) { resultEl.className = "test-result err"; resultEl.textContent = e2.message; }
  } else if (b.dataset.sact === "delete") {
    if (await confirmDlg(`「${t.name}」を削除しますか?`, "この操作は元に戻せません。", "削除する")) {
      await run(async () => { await api(`/api/storage/targets/${tid}`, { method: "DELETE" }); await fetchTargets(); }, "削除しました");
      renderStoragePanel();
    }
  }
});

function targetDetail(t) {
  const who = t.username ? esc(t.username) : (t.protocol === "smb" ? "ゲスト接続" : "認証なし");
  const sub = t.subpath ? " / " + esc(t.subpath) : "";
  if (t.protocol === "webdav") return `${esc(t.server)}${sub} ・ ${who}${t.tls_insecure ? " ・ 証明書を検証しない" : ""}`;
  return `${esc(t.server)} / ${esc(t.share)}${sub} ・ ${who}`;
}
function protoHint(p) {
  return p === "webdav"
    ? "Nextcloud などの WebDAV。Nextcloud ならサーバーのURL(例: https://cloud.example.com)だけでOKです。二段階認証を使っている場合は、Nextcloudの「設定 → セキュリティ」で作った「アプリパスワード」を入力してください。"
    : "SMB (Windows共有)。Unraid・TrueNASどちらも標準で使えます。Unraidの「パブリック」共有ならユーザー名は空欄(ゲスト接続)で大丈夫です。";
}

/* ---------------- upload ---------------- */
const OKEXT = /\.(jar|zip|7z|rar|mcpack|disabled)$/i;
const tasks = []; let active = 0; let batchAdded = 0, batchDup = 0, batchErr = 0, queueRaf = 0;

function enqueue(files) {
  if (state.storage && state.storage.error) {
    toast("ストレージに接続できていないため、アップロードできません", true);
    return;
  }
  files = files.filter(Boolean);
  if (!files.length) { toast("対象のファイルが見つかりませんでした", true); return; }
  const category = $("#catOverride").value;
  for (const file of files) tasks.push({ file, category, status: "wait", pct: 0, msg: "待機中" });
  $("#queue").hidden = false;
  drawQueue(); pump();
}
function pump() {
  while (active < 3) {
    const t = tasks.find((x) => x.status === "wait");
    if (!t) break;
    t.status = "run"; active++;
    upload(t).then(() => { active--; pump(); if (!active && !tasks.some((x) => x.status === "wait")) finishBatch(); });
  }
}
function upload(t) {
  return new Promise((resolve) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/api/upload?filename=" + encodeURIComponent(t.file.name) + (t.category ? "&category=" + t.category : ""));
    xhr.setRequestHeader("X-Requested-With", "mcpl");
    xhr.upload.onprogress = (e) => {
      if (e.lengthComputable) { t.pct = Math.round((e.loaded / e.total) * 100); t.msg = t.pct >= 100 ? "解析中…" : `アップロード中 ${t.pct}%`; scheduleQueue(); }
    };
    xhr.onload = () => {
      let d = null; try { d = JSON.parse(xhr.responseText); } catch { /* */ }
      if (xhr.status >= 200 && xhr.status < 300 && d) {
        t.pct = 100;
        if (d.status === "added") { t.status = "added"; batchAdded++; t.msg = `追加: ${d.name} ${d.version || "(版不明)"} [${CATS[d.category]}]`; scheduleRefresh(); }
        else { t.status = "dup"; batchDup++; t.msg = `登録済み: ${d.name} ${d.version || ""}`; }
      } else { t.status = "error"; batchErr++; t.msg = (d && d.error) || `エラー (HTTP ${xhr.status})`; }
      scheduleQueue(); resolve();
    };
    xhr.onerror = () => { t.status = "error"; batchErr++; t.msg = "通信に失敗しました"; scheduleQueue(); resolve(); };
    xhr.send(t.file);
  });
}
function finishBatch() {
  const parts = [`${batchAdded} 件追加`];
  if (batchDup) parts.push(`${batchDup} 件は登録済み`);
  if (batchErr) parts.push(`${batchErr} 件エラー`);
  toast("アップロード完了: " + parts.join("、"), batchErr > 0);
  batchAdded = batchDup = batchErr = 0;
  refresh();
}
function scheduleQueue() { if (!queueRaf) queueRaf = requestAnimationFrame(() => { queueRaf = 0; drawQueue(); }); }
function drawQueue() {
  const done = tasks.filter((t) => ["added", "dup", "error"].includes(t.status)).length;
  $("#queueSummary").textContent = `${done} / ${tasks.length} 件完了`;
  const shown = tasks.slice(-300);
  $("#queueList").innerHTML = shown.map((t) => `
    <div class="q ${t.status === "added" ? "added" : t.status === "error" ? "error" : ""}">
      <div class="fn" title="${esc(t.file.name)}">${esc(t.file.name)}</div>
      <div><div class="st" title="${esc(t.msg)}">${esc(t.msg)}</div>${t.status === "run" ? `<div class="bar"><i style="width:${t.pct}%"></i></div>` : ""}</div>
    </div>`).join("");
  const list = $("#queueList"); if (tasks.some((t) => t.status === "run")) list.scrollTop = list.scrollHeight;
}
$("#queueClear").addEventListener("click", () => {
  for (let i = tasks.length - 1; i >= 0; i--) if (["added", "dup", "error"].includes(tasks[i].status)) tasks.splice(i, 1);
  if (!tasks.length) $("#queue").hidden = true; else drawQueue();
});

/* drag & drop (ウィンドウ全体で受ける / フォルダも再帰的に読む) */
const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
let dragDepth = 0;
window.addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; $("#overlay").classList.add("on"); });
window.addEventListener("dragover", (e) => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
window.addEventListener("dragleave", (e) => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $("#overlay").classList.remove("on"); });
window.addEventListener("drop", async (e) => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; $("#overlay").classList.remove("on");
  enqueue(await collectDropped(e.dataTransfer));
});
async function collectDropped(dt) {
  // drop イベント中に同期でエントリを取り出しておく必要がある
  const entries = [], loose = [];
  for (const it of [...(dt.items || [])]) {
    if (it.kind !== "file") continue;
    const en = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
    if (en) entries.push(en); else { const f = it.getAsFile(); if (f) loose.push(f); }
  }
  if (!entries.length && !loose.length) return [...(dt.files || [])];
  const out = loose;
  for (const en of entries) await walk(en, out, false);
  return out;
}
async function walk(entry, out, inDir) {
  if (entry.isFile) {
    const f = await new Promise((res) => entry.file(res, () => res(null)));
    if (f && (!inDir || OKEXT.test(f.name))) out.push(f);
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    let batch;
    do {
      batch = await new Promise((res) => reader.readEntries(res, () => res([])));
      for (const e of batch) await walk(e, out, true);
    } while (batch.length);
  }
}

let jobTimer = null;
const seenDone = new Set();
async function pollJobs() {
  clearTimeout(jobTimer);
  try {
    const { jobs } = await api("/api/jobs");
    const firstLoad = !state.jobsLoaded; state.jobsLoaded = true;
    for (const j of jobs) {
      if (j.status !== "running" && !seenDone.has(j.id)) {
        seenDone.add(j.id);
        if (!firstLoad) { toast(`${j.title}: ${j.status === "done" ? "完了しました" : "エラーで終了しました"}`, j.status !== "done"); refresh(); if (state.storageOpen) fetchTargets().then(renderStoragePanel); }
      }
    }
    state.jobs = jobs.filter((j) => j.status === "running" || (Date.now() - new Date(j.finished).getTime() < 5 * 60 * 1000));
    renderJobs();
    jobTimer = setTimeout(pollJobs, jobs.some((j) => j.status === "running") ? 1500 : 15000);
  } catch { jobTimer = setTimeout(pollJobs, 15000); }
}

  $("#jobs").innerHTML = state.jobs.map((j) => `

      <div class="acts need-editor">
        <button class="btn small primary" type="button" data-act="src-detect">自動で探す</button>
        <button class="btn small" type="button" data-act="src-link">URLで紐付け</button>
      </div>
      ${cands ? (cands.length ? `<div class="muted" style="margin-top:8px">候補(クリックで紐付け):</div>
        <div>${cands.map((c, i) => `<div class="cand"><div class="t">${esc(c.title)} <small>${esc(PROVIDERS[c.provider])}・${(c.downloads || 0).toLocaleString()} DL${c.summary ? "・" + esc(c.summary.slice(0, 60)) : ""}</small></div>
          <span style="white-space:nowrap"><a class="btn small" href="${esc(c.page_url)}" target="_blank" rel="noopener">開く</a>
          <button class="btn small need-editor" type="button" data-act="src-pick" data-i="${i}">これにする</button></span></div>`).join("")}</div>`
        : `<div class="muted" style="margin-top:8px">見つかりませんでした。配布ページのURLで紐付けてください。</div>`) : ""}
    </div>`;
  }
  const L = s.latest || {};
  const stTag = s.status === "update" ? '<span class="tag upd">更新あり</span>'
    : s.status === "up_to_date" ? '<span class="tag">最新</span>'
    : `<span class="tag ${s.status === "error" ? "warn" : "soft"}">${esc(SRC_STATUS[s.status] || s.status)}</span>`;
  return `<div class="srcbox">
    <div class="head"><strong>配布元</strong><span class="tag soft">${esc(s.provider_label)}</span>
      <a href="${esc(s.page_url)}" target="_blank" rel="noopener">${esc(s.title)}</a>${stTag}</div>
    ${L.version ? `<div style="margin-top:4px">配布元の最新: <b>${esc(L.version)}</b>${L.date ? ` <span class="muted">(${fmtDate(L.date)})</span>` : ""}${L.file_name ? ` <span class="muted">${esc(L.file_name)}</span>` : ""}</div>` : ""}
    ${s.message ? `<div class="muted">${esc(s.message)}</div>` : ""}
    <div class="muted">絞り込み: ローダー ${s.loaders.length ? esc(s.loaders.join(", ")) : "指定なし"} / MC ${s.game_versions.length ? esc(s.game_versions.join(", ")) : "指定なし"}
      ${s.linked_by === "name" ? "・名前から推定した紐付けです" : ""}${s.checked_at ? `・確認 ${fmtDateTime(s.checked_at)}` : ""}</div>
    <div class="acts need-editor">
      <button class="btn small" type="button" data-act="src-check">最新版を確認</button>
      ${s.status === "update" && L.downloadable ? `<button class="btn small primary" type="button" data-act="src-download">最新版を保存 (${esc(L.version || "")})</button>` : ""}
      <button class="btn small" type="button" data-act="src-filter">絞り込みを変更</button>
      <button class="btn small" type="button" data-act="src-link">紐付け直す</button>
      <button class="btn small danger" type="button" data-act="src-unlink">解除</button>
    </div>
  </div>`;
}
async function sourceAction(it, act, btn) {
  const busy = (on) => { if (btn) { btn.disabled = on; if (on) btn.dataset.old = btn.textContent, btn.textContent = "処理中…"; else btn.textContent = btn.dataset.old; } };
  try {
    busy(true);
    if (act === "src-detect") {
      const r = await api(`/api/items/${it.id}/source/detect`, { method: "POST" });
      if (r.linked) { toast(r.how); delete state.candidates[it.id]; }
      else { state.candidates[it.id] = r.candidates; }
    } else if (act === "src-pick") {
      const c = state.candidates[it.id][Number(btn.dataset.i)];
      await api(`/api/items/${it.id}/source`, { json: { provider: c.provider, project_id: c.project_id } });
      delete state.candidates[it.id]; toast("紐付けました");
    } else if (act === "src-link") {
      busy(false);
      const r = await openDialog(`<h3>配布元をURLで紐付け</h3>
        <p>Modrinth / SpigotMC / CurseForge の配布ページのURLを貼り付けてください。</p>
        <label>URL<input type="text" name="url" placeholder="https://modrinth.com/plugin/luckperms" required></label>
        <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn primary" value="ok">紐付け</button></div>`);
      if (!r) return;
      await api(`/api/items/${it.id}/source`, { json: { url: r.url } }); toast("紐付けました");
    } else if (act === "src-check") {
      const r = await api(`/api/items/${it.id}/source/check`, { method: "POST" });
      toast(r.source.message || SRC_STATUS[r.source.status], r.source.status === "error");
    } else if (act === "src-download") {
      const r = await api(`/api/items/${it.id}/source/download`, { method: "POST" });
      toast(r.status === "added" ? `保存しました: ${r.version || ""}` : (r.message || "すでに保存済みです"));
    } else if (act === "src-filter") {
      busy(false);
      const s = it.source;
      const r = await openDialog(`<h3>絞り込み条件</h3>
        <p>最新版を探すときの条件です。Mod は Minecraft のバージョンを指定しないと、別のMCバージョン向けの版が「最新」になることがあります。カンマ区切りで複数指定できます。</p>
        <label>ローダー(例: paper, spigot / fabric / neoforge / forge)<input type="text" name="loaders" value="${esc(s.loaders.join(", "))}"></label>
        <label>Minecraft のバージョン(例: 1.20.1, 1.21.1)<input type="text" name="game_versions" value="${esc(s.game_versions.join(", "))}"></label>
        <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn primary" value="ok">保存して確認</button></div>`);
      if (!r) return;
      await api(`/api/items/${it.id}/source`, { method: "PATCH", json: r });
    } else if (act === "src-unlink") {
      busy(false);
      if (!(await confirmDlg("配布元の紐付けを解除しますか?", "保存済みのファイルはそのまま残ります。", "解除する"))) return;
      await api(`/api/items/${it.id}/source`, { method: "DELETE" });
    }
    await refresh();
  } catch (e) { toast(e.message, true); try { busy(false); } catch { /* */ } renderPanel(); }
}
async function runUpdates(opts) {
  try { jobStarted(await api("/api/updates/run", { json: opts })); } catch (e) { toast(e.message, true); }
}
$("#updCheckBtn").addEventListener("click", () => runUpdates({ check: true }));
$("#updMore").addEventListener("change", (e) => {
  const v = e.target.value; e.target.value = "";
  if (v === "detect") runUpdates({ detect: true, check: true });
  if (v === "download") runUpdates({ check: true, download: true });
});
$("#importBtn").addEventListener("click", async () => {
  const r = await openDialog(`<h3>URLから追加</h3>
    <p>Modrinth / SpigotMC / CurseForge の配布ページのURLから最新版をダウンロードして登録し、配布元も紐付けます。</p>
    <label>URL<input type="text" name="url" placeholder="https://modrinth.com/mod/fabric-api" required></label>
    <label>ローダー(Mod の場合は指定を推奨。例: fabric / neoforge / forge / paper)<input type="text" name="loaders"></label>
    <label>Minecraft のバージョン(Mod の場合は指定を推奨。例: 1.20.1)<input type="text" name="game_versions"></label>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn primary" value="ok">取得して登録</button></div>`);
  if (!r) return;
  toast("取得しています…");
  try {
    const d = await api("/api/import", { json: r });
    toast(d.status === "added" ? `追加しました: ${d.name} ${d.version || ""}` : `登録済みです: ${d.name} ${d.version || ""}`);
    await refresh();
    if (d.item_id) openPanel(d.item_id);
  } catch (e) { toast(e.message, true); }
});

/* ---------------- storage contents / migrate ---------------- */
async function showContents(t) {
  await customDialog(`<h3>「${esc(t.name)}」の中身</h3><div id="cBody"><p>読み込み中…(ネットワーク上の保存先は時間がかかることがあります)</p></div>
    <div class="foot"><button class="btn" type="button" data-c="migrate">この保存先から移行…</button><button class="btn primary" type="button" data-c="close">閉じる</button></div>`,
  (form, done) => {
    form.addEventListener("click", (e) => {
      const b = e.target.closest("[data-c]"); if (!b) return;
      done(null);
      if (b.dataset.c === "migrate") setTimeout(() => openMigrate(t), 0);
    });
    api(`/api/storage/targets/${t.id}/contents`).then((d) => {
      form.querySelector("#cBody").innerHTML = `
        <p>${esc(d.where)}</p>
        <p><b>${d.totals.items}</b> 件 / <b>${d.totals.files}</b> ファイル / <b>${fmtSize(d.totals.size)}</b>
          ${d.totals.missing ? ` / <span style="color:var(--danger)">見つからないファイル ${d.totals.missing}</span>` : ""}</p>
        <div class="scroll"><table class="tbl"><tr><th>種類</th><th>名前</th><th>最新</th><th>版数</th><th>サイズ</th></tr>
          ${d.items.map((i) => `<tr><td><span class="badge ${i.category}">${CATS[i.category]}</span></td><td>${esc(i.name)}${i.missing ? ' <span class="tag warn">欠損</span>' : ""}</td>
            <td>${esc(verLabel(i.latest))}</td><td>${i.versions}</td><td>${fmtSize(i.total_size)}</td></tr>`).join("") || `<tr><td colspan="5">登録されたものはありません</td></tr>`}
        </table></div>
        ${d.unregistered.count ? `<p>未登録のファイル(library 内・${d.unregistered.count} 件。この保存先に切り替えて「inboxを取り込む」で登録できます):</p><div class="filelist">${esc(d.unregistered.files.join("\n"))}</div>` : ""}
        ${d.inbox.count ? `<p>inbox のファイル(${d.inbox.count} 件):</p><div class="filelist">${esc(d.inbox.files.join("\n"))}</div>` : ""}`;
    }).catch((e) => { form.querySelector("#cBody").innerHTML = `<p style="color:var(--danger)">${esc(e.message)}</p>`; });
  }, true);
}
async function openMigrate(t) {
  if (!state.targets.length) await fetchTargets();
  const others = state.targets.filter((x) => x.id !== t.id);
  if (!others.length) { toast("移行先になる保存先がありません。先に接続を追加してください", true); return; }
  const r = await openDialog(`<h3>「${esc(t.name)}」から移行</h3>
    <p>登録済みのファイルと情報(バージョン・メモ・配布元の紐付け)を、別の保存先にコピーします。移行先に同じファイルが既にあればスキップします。</p>
    <label>移行先<select name="dest_id">${others.map((x) => `<option value="${x.id}">${esc(x.name)}(${esc(x.protocol_label)})</option>`).join("")}</select></label>
    <label>方法<select name="mode">
      <option value="copy">コピー(移行元にも残す)</option>
      <option value="move">移動(コピーが成功したものを移行元から削除する)</option>
    </select></label>
    <div class="foot"><button class="btn" value="cancel" formnovalidate>キャンセル</button><button class="btn primary" value="ok">移行を開始</button></div>`);
  if (!r) return;
  if (r.mode === "move" && !(await confirmDlg("移動しますか?", `コピーに成功したファイルは「${t.name}」から削除されます。`, "移動する"))) return;
  try { jobStarted(await api("/api/storage/migrate", { json: { source_id: t.id, dest_id: Number(r.dest_id), mode: r.mode } })); }
  catch (e) { toast(e.message, true); }
}


/* ---------------- CraftShelf self update ---------------- */
async function checkSelfUpdate(force) {
  try {
    const d = await api("/api/system/update" + (force ? "?force=1" : ""));
    state.selfUpd = d;
    const b = $("#selfUpdBtn");
    b.textContent = d.update_available ? `🔄 パネルの更新 (v${d.latest})` : "🔄 パネルの更新";
    b.classList.toggle("primary", !!d.update_available);
    return d;
  } catch (e) { if (force) toast(e.message, true); return null; }
}
$("#selfUpdBtn").addEventListener("click", async () => {
  await customDialog(`<h3>CraftShelf の更新</h3><div id="suBody"><p>GitHub を確認しています…</p></div>
    <div class="foot"><button class="btn" type="button" data-su="close">閉じる</button><button class="btn" type="button" data-su="recheck">再確認</button>
    <button class="btn primary" type="button" data-su="apply" hidden>更新して再起動</button></div>`, (form, done) => {
    const draw = (d) => {
      const body = form.querySelector("#suBody"), ap = form.querySelector("[data-su=apply]");
      if (!d) { body.innerHTML = `<p style="color:var(--danger)">確認できませんでした</p>`; return; }
      ap.hidden = !d.update_available;
      body.innerHTML = `
        <p>現在の版: <b>v${esc(d.current)}</b> ・ GitHub の最新版: <b>${d.latest ? "v" + esc(d.latest) : "-"}</b></p>
        <p>取得元: <a href="https://github.com/${esc(d.repo)}" target="_blank" rel="noopener">github.com/${esc(d.repo)}</a> (${esc(d.branch)})</p>
        ${d.error ? `<p style="color:var(--danger)">${esc(d.error)}</p>` : d.update_available
          ? `<p>新しい版があります。「更新して再起動」でダウンロード・インストールし、数秒で新しい版に切り替わります。保存したファイルや登録情報はそのまま残ります。</p>`
          : `<p>最新の版を使っています。</p>`}
        ${d.notes && d.notes.length ? `<div class="scroll" style="padding:8px 10px">${d.notes.map((n) => `<p><b>v${esc(n.version)}</b> ${esc(n.title)}</p><div class="filelist" style="max-height:none;margin-bottom:8px">${esc(n.body)}</div>`).join("")}</div>` : ""}`;
    };
    checkSelfUpdate(true).then(draw);
    form.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-su]"); if (!b) return;
      if (b.dataset.su === "close") return done(null);
      if (b.dataset.su === "recheck") { form.querySelector("#suBody").innerHTML = "<p>確認しています…</p>"; draw(await checkSelfUpdate(true)); }
      if (b.dataset.su === "apply") {
        const from = state.selfUpd && state.selfUpd.current;
        try { jobStarted(await api("/api/system/update", { method: "POST" })); } catch (ex) { toast(ex.message, true); return; }
        done(null);
        waitForNewVersion(from);
      }
    });
  });
});
async function waitForNewVersion(from) {
  const t0 = Date.now();
  while (Date.now() - t0 < 5 * 60 * 1000) {
    await new Promise((r) => setTimeout(r, 2500));
    try {
      const d = await (await fetch("/api/system/info")).json();
      if (d.version && d.version !== from) { toast(`CraftShelf v${d.version} に更新しました。画面を再読み込みします`); setTimeout(() => location.reload(), 1500); return; }
    } catch { /* 再起動中 */ }
  }
}

/* init */
(function init() {
  const sel = $("#catOverride");
  for (const [k, n] of Object.entries(CATS)) sel.insertAdjacentHTML("beforeend", `<option value="${k}">${n}として登録</option>`);
  checkAuth();
})();
</script>
