<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>CraftShelf</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CraftShelf">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/skins.css">
<script src="/static/i18n-en.js" defer></script>
<!-- 画面の処理は役割ごとに分けて、この順に読む(後のファイルは前のファイルの名前を使える) -->
<script src="/static/js/base.js" defer></script>
<script src="/static/js/auth.js" defer></script>
<script src="/static/js/library.js" defer></script>
<script src="/static/js/dashboard.js" defer></script>
<script src="/static/js/servers.js" defer></script>
<script src="/static/js/console.js" defer></script>
<script src="/static/js/cfgdiff.js" defer></script>
<script src="/static/js/detail.js" defer></script>
<script src="/static/js/jobs.js" defer></script>
<script src="/static/js/settings.js" defer></script>
<script src="/static/js/upload.js" defer></script>
<script src="/static/js/palette.js" defer></script>
<script src="/static/js/shell.js" defer></script>
<script src="/static/js/guide.js" defer></script>
<script src="/static/js/passkey.js" defer></script>
<script src="/static/js/nav.js" defer></script>
<script src="/static/js/init.js" defer></script>
</head>
<body>
<div id="app" hidden>
  <aside class="sidenav glass" id="sidenav" aria-label="メニュー"></aside>
  <header class="topbar glass">
    <div class="brand">
      <img class="logo" src="/static/icon.svg" alt="" aria-hidden="true">
      <div style="min-width:0"><h1>CraftShelf <span class="v02" title="CraftShelf v02">v02</span></h1><div class="sub" id="stats"></div></div>
    </div>
    <button class="gsearch" id="gsearch" type="button" aria-label="検索(Ctrl+K)"><span class="gs-i" id="gsIcon"></span><span class="gs-t">アドオン・サーバー・設定を検索</span><kbd>⌘K</kbd></button>
    <div class="top-actions">
      <button class="icon-btn need-editor add-btn" id="addBtn" type="button" aria-label="追加" title="追加"></button>
      <button class="icon-btn need-editor" id="updBtn" type="button" aria-label="更新の確認" title="更新の確認"></button>
      <button class="icon-btn" id="cmdBtn" type="button" aria-label="検索(Ctrl+K)" title="検索(Ctrl+K)"></button>
      <button class="icon-btn bell" id="bellBtn" type="button" aria-label="お知らせ" title="お知らせ"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定" title="設定"></button>
    </div>
  </header>

  <main class="wrap">
    <div class="large-title">
      <h2 id="viewTitle">ライブラリ</h2>
      <div class="pill tappable" id="storageInfo" role="button" tabindex="0" aria-label="保存先の状況"></div>
    </div>
    <button class="gsearch-m" id="gsearchM" type="button"><span id="gsIconM"></span><span>すべてを検索</span></button>
    <div class="banner" id="storageBanner" hidden></div>
    <div class="banner info" id="updBanner" hidden></div>
    <div class="jobs" id="jobs"></div>
    <section id="dash" hidden></section>
    <div id="libView">

    <section class="setup-card glass" id="setupCard" hidden></section>
    <section class="dropcard need-editor" id="drop">
      <div class="dz">
        <div class="ic" id="dropIcon"></div>
        <div><strong>ドラッグ&amp;ドロップで追加</strong><span class="s">.jar / .zip やフォルダをまとめて。名前とバージョンは自動で読み取ります</span></div>
      </div>
      <div class="acts">
        <select id="catOverride" class="compact" aria-label="登録するときの種類"><option value="">種類を自動で判定</option></select>
        <button class="btn filled small" id="pickFiles" type="button">ファイルを選択</button>
        <button class="btn small" id="pickDir" type="button">フォルダ</button>
        <button class="btn small tinted" id="openSearchBtn" type="button">配布サイトで探す</button>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory hidden>
      <input type="file" id="packInput" accept=".mrpack,.zip" hidden>
    </section>

    <section class="group queue" id="queue" hidden>
      <div class="queue-head"><span id="queueSummary"></span><button class="btn plain small" id="queueClear" type="button">完了分を消す</button></div>
      <div class="queue-list" id="queueList"></div>
    </section>

    <div class="lib-sum" id="libSum"></div>
    <div class="toolbar glass">
      <div class="row1">
        <label class="search"><span id="searchIcon"></span><input type="search" id="search" placeholder="検索" aria-label="検索"></label>
        <button class="btn small tb-more" type="button" id="tbMore" aria-label="絞り込み・並び順を表示"><span id="tbMoreIcon"></span><span>絞り込み</span><i class="dot" hidden></i></button>
        <select id="platSel" class="compact" aria-label="サーバーソフトで絞り込み"><option value="">サーバーソフト: すべて</option></select>
        <select id="mcSel" class="compact" aria-label="対応MCバージョンで絞り込み"><option value="">MC: すべて</option></select>
        <button class="btn small" type="button" id="selBtn">選択</button>
        <select id="sortSel" class="compact" aria-label="並び順">
          <option value="fav:1">お気に入りを上に</option>
          <option value="name:1">名前順</option>
          <option value="added:-1">追加が新しい順</option>
          <option value="upd:1">更新があるものを上に</option>
          <option value="size:-1">サイズが大きい順</option>
          <option value="count:-1">保存しているバージョンが多い順</option>
        </select>
      </div>
      <div class="segmented" id="chips" role="group" aria-label="種類で絞り込み"></div>
      <div class="tagrow" id="tagChips" role="group" aria-label="タグで絞り込み" hidden></div>
    </div>

    <section class="group" id="list"></section>
    </div>
    <section id="setsView" hidden></section>
    <section id="serversView" hidden></section>
  </main>
  <div class="selbar glass" id="selBar" hidden></div>
  <nav class="tabbar glass" id="tabbar" role="tablist" aria-label="画面の切り替え">
    <button type="button" role="tab" data-view="library" aria-selected="true"><span class="ti" id="tiLib"></span><span>ライブラリ</span></button>
    <button type="button" role="tab" data-view="sets" aria-selected="false"><span class="ti" id="tiSets"></span><span>セット</span></button>
    <button type="button" class="tab-add need-editor" id="tabAdd" aria-label="追加"><span class="ti" id="tiAdd"></span></button>
    <button type="button" role="tab" data-view="dash" aria-selected="false"><span class="ti" id="tiDash"></span><span>ホーム</span></button>
    <button type="button" role="tab" data-view="servers" aria-selected="false"><span class="ti" id="tiSrv"></span><span>サーバー</span></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="side" id="panel" aria-label="詳細" aria-hidden="true"></aside>
<dialog class="sheet" id="dlg"><form method="dialog" id="dlgForm" novalidate></form></dialog>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="overlay" id="overlay"><div class="glass">ここにドロップして登録</div></div>
<div class="toasts" id="toasts" aria-live="polite" popover="manual"></div>
<div class="auth" id="auth" hidden><form class="glass" id="authForm" autocomplete="on"></form></div>
<div class="updating" id="updating" hidden><div class="card glass" id="updatingCard"></div></div>
</body>
</html>
