<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>CraftShelf</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/i18n-en.js" defer></script>
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="app" hidden>
  <header class="topbar glass">
    <div class="brand">
      <img class="logo" src="/static/icon.svg" alt="" aria-hidden="true">
      <div style="min-width:0"><h1>CraftShelf</h1><div class="sub" id="stats"></div></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn need-editor" id="addBtn" type="button" aria-label="追加" title="追加"></button>
      <button class="icon-btn need-editor" id="updBtn" type="button" aria-label="更新の確認" title="更新の確認"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定" title="設定"></button>
    </div>
  </header>

  <main class="wrap">
    <div class="large-title">
      <h2 id="viewTitle">ライブラリ</h2>
      <div class="pill tappable" id="storageInfo" role="button" tabindex="0" aria-label="保存先の状況"></div>
    </div>
    <div class="banner" id="storageBanner" hidden></div>
    <div class="jobs" id="jobs"></div>
    <section id="dash" hidden></section>
    <div id="libView">

    <section class="dropcard need-editor" id="drop">
      <div class="dz">
        <div class="ic" id="dropIcon"></div>
        <div><strong>ドラッグ&amp;ドロップで追加</strong><span class="s">.jar / .zip やフォルダをまとめて。名前とバージョンは自動で読み取ります</span></div>
      </div>
      <div class="acts">
        <select id="catOverride" class="compact" aria-label="登録するときの種類"><option value="">種類を自動で判定</option></select>
        <button class="btn filled small" id="pickFiles" type="button">ファイルを選択</button>
        <button class="btn small" id="pickDir" type="button">フォルダ</button>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory hidden>
      <input type="file" id="packInput" accept=".mrpack,.zip" hidden>
    </section>

    <section class="group queue" id="queue" hidden>
      <div class="queue-head"><span id="queueSummary"></span><button class="btn plain small" id="queueClear" type="button">完了分を消す</button></div>
      <div class="queue-list" id="queueList"></div>
    </section>

    <div class="toolbar glass">
      <div class="row1">
        <label class="search"><span id="searchIcon"></span><input type="search" id="search" placeholder="検索" aria-label="検索"></label>
        <select id="platSel" class="compact" aria-label="サーバーソフトで絞り込み"><option value="">サーバーソフト: すべて</option></select>
        <select id="mcSel" class="compact" aria-label="対応MCバージョンで絞り込み"><option value="">MC: すべて</option></select>
        <button class="btn small" type="button" id="selBtn">選択</button>
        <select id="sortSel" class="compact" aria-label="並び順">
          <option value="name:1">名前順</option>
          <option value="added:-1">追加が新しい順</option>
          <option value="size:-1">サイズが大きい順</option>
          <option value="count:-1">版数が多い順</option>
        </select>
      </div>
      <div class="segmented" id="chips" role="group" aria-label="種類で絞り込み"></div>
      <div class="tagrow" id="tagChips" role="group" aria-label="タグで絞り込み" hidden></div>
    </div>

    <section class="group" id="list"></section>
    </div>
    <section id="setsView" hidden></section>
    <section id="serversView" hidden></section>
  </main>
  <div class="selbar glass" id="selBar" hidden></div>
  <nav class="tabbar glass" id="tabbar" role="tablist" aria-label="画面の切り替え">
    <button type="button" role="tab" data-view="library" aria-selected="true"><span class="ti" id="tiLib"></span><span>ライブラリ</span></button>
    <button type="button" role="tab" data-view="dash" aria-selected="false"><span class="ti" id="tiDash"></span><span>ダッシュボード</span></button>
    <button type="button" role="tab" data-view="sets" aria-selected="false"><span class="ti" id="tiSets"></span><span>セット</span></button>
    <button type="button" role="tab" data-view="servers" aria-selected="false"><span class="ti" id="tiSrv"></span><span>サーバー</span></button>
  </nav>
</div>

<div class="scrim" id="scrim"></div>
<aside class="side" id="panel" aria-label="詳細" aria-hidden="true"></aside>
<dialog class="sheet" id="dlg"><form method="dialog" id="dlgForm" novalidate></form></dialog>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="overlay" id="overlay"><div class="glass">ここにドロップして登録</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="auth" id="auth" hidden><form class="glass" id="authForm" autocomplete="on"></form></div>
<div class="updating" id="updating" hidden><div class="card glass" id="updatingCard"></div></div>
</body>
</html>
