<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>CraftShelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233ad16a'/%3E%3Cstop offset='1' stop-color='%231f8f47'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M8 12l8-4 8 4v9l-8 4-8-4z M8 12l8 4 8-4 M16 16v9' fill='none' stroke='white' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<div id="app" hidden>
  <header class="topbar glass">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4v8l-8 4-8-4z M4 8l8 4 8-4 M12 12v8"/></svg></div>
      <div style="min-width:0"><h1>CraftShelf</h1><div class="sub" id="stats"></div></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn need-editor" id="addBtn" type="button" aria-label="追加" title="追加"></button>
      <button class="icon-btn need-editor" id="updBtn" type="button" aria-label="更新の確認" title="更新の確認"></button>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="設定" title="設定"></button>
    </div>
  </header>

  <main class="wrap">
    <div class="large-title">
      <h2>ライブラリ</h2>
      <div class="pill" id="storageInfo"></div>
    </div>
    <div class="banner" id="storageBanner" hidden></div>
    <div class="jobs" id="jobs"></div>

    <section class="dropcard need-editor" id="drop">
      <div class="dz">
        <div class="ic" id="dropIcon"></div>
        <div><strong>ドラッグ&amp;ドロップで追加</strong><span class="s">.jar / .zip やフォルダをまとめて。名前とバージョンは自動で読み取ります</span></div>
      </div>
      <div class="acts">
        <select id="catOverride" class="compact" aria-label="登録先の種類"><option value="">種類: 自動判定</option></select>
        <button class="btn filled small" id="pickFiles" type="button">ファイルを選択</button>
        <button class="btn small" id="pickDir" type="button">フォルダ</button>
      </div>
      <input type="file" id="fileInput" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory hidden>
    </section>

    <section class="group queue" id="queue" hidden>
      <div class="queue-head"><span id="queueSummary"></span><button class="btn plain small" id="queueClear" type="button">完了分を消す</button></div>
      <div class="queue-list" id="queueList"></div>
    </section>

    <div class="toolbar glass">
      <div class="row1">
        <label class="search"><span id="searchIcon"></span><input type="search" id="search" placeholder="検索" aria-label="検索"></label>
        <select id="sortSel" class="compact" aria-label="並び順">
          <option value="name:1">名前順</option>
          <option value="added:-1">追加が新しい順</option>
          <option value="size:-1">サイズが大きい順</option>
          <option value="count:-1">版数が多い順</option>
        </select>
      </div>
      <div class="segmented" id="chips" role="group" aria-label="種類で絞り込み"></div>
    </div>

    <section class="group" id="list"></section>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="side" id="panel" aria-label="詳細" aria-hidden="true"></aside>
<dialog class="sheet" id="dlg"><form method="dialog" id="dlgForm" novalidate></form></dialog>
<div class="menu" id="menu" hidden role="menu"></div>
<div class="overlay" id="overlay"><div class="glass">ここにドロップして登録</div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="auth" id="auth" hidden><form class="glass" id="authForm" autocomplete="on"></form></div>
<div class="updating" id="updating" hidden><div class="card glass" id="updatingCard"></div></div>
</body>
</html>
